# Blueprint de Render para la API de Agro Control.
# Render lo detecta al crear un "Blueprint" desde el repositorio de GitHub.
# Los valores marcados con sync: false se piden en el panel de Render (no se guardan en git).
services:
  - type: web
    name: agro-control-api
    runtime: node
    plan: free
    # Misma zona que la base de Neon (AWS us-east-2, Ohio) para minimizar la latencia
    region: ohio
    rootDir: backend
    # Solo redesplegar cuando cambie la API (los cambios del frontend los publica Vercel)
    buildFilter:
      paths:
        - backend/**
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /test-db
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Cadena de conexión de Neon (Connection string, con ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Secreto aleatorio para firmar los JWT (Render lo genera)
      - key: JWT_SECRET
        generateValue: true
      # Web publicada en Vercel + origen de la app Android (Capacitor), separados por coma
      - key: CORS_ORIGINS
        value: https://agro-control-theta.vercel.app,https://localhost
      - key: SIMULAR_SENSORES
        value: "true"
